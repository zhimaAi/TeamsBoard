appId: cn.goteams.client
productName: TeamsBoard
asar: true

directories:
  output: ../dist/desktop

files:
  - main/**/*
  - preload/**/*
  - shared/**/*
  - build/icon.png
  - package.json

win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: "TeamsBoard-windows-${arch}.${ext}"
  extraResources:
    - from: resources/backend
      to: backend
      filter:
        - client.exe

mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: "TeamsBoard-macos-${arch}.${ext}"
  extraResources:
    - from: resources/backend
      to: backend
      filter:
        - client

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # electron-builder 为开始菜单快捷方式写入与 Main 一致的 AppUserModelID，
  # Windows Toast 需要此安装身份；不要用复制出来的裸 exe 验收通知。
  createStartMenuShortcut: true
  shortcutName: TeamsBoard
