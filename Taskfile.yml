version: '3'

# ----------------------------------------------------------------------------
# GoTeams Client 构建任务 (go-task)
#
# 常用命令：
#   task                 列出全部任务
#   task dev1            dev1 环境开发模式（前端 Vite 热更新 + Go 后端，连接 dev1 云端）
#   task prod            生产环境开发模式（前端 Vite 热更新 + Go 后端，连接生产云端）
#   task web:build       仅构建前端，输出 web/dist
#   task build           交叉编译全部目标平台，macOS 产物同时输出 zip（0755 可执行权限），打包时若 web/dist 存在则一并带入
#   task release         完整发布：先 web:build 再 build（产物含前端界面）
#   task build:windows-amd64   仅构建单个平台
#   task clean           清理 dist/
#
# 环境配置说明：
#   - 后端配置：configs/goteams-client/config_<env>.ini（云端 URL）
#   - 前端配置：web/.env.<env>（云端 URL + 本地客户端 URL + 端口）
#   - 通过 APP_ENV 环境变量选择环境，后端自动加载对应配置
#
# 关于「dev」与前端的区别：
#   - task dev1 通过 `npm --prefix web run dev1` 启动：
#     它用 concurrently 同时启动 Go 后端与 Vite dev server，并把 /api/local 代理到 :18900。
#   - 即前端在开发模式下始终由 Vite（npm run dev1）提供、带 HMR 热更新，不会使用
#     预打包的 web/dist（预打包仅在 build/release 发布模式、且 web/dist 已构建时才带入）。
#   - 纯后端调试（不需要前端界面）可用 `task run`（只 go run 后端，不启动 Vite）。
#
# 说明：
#   - 数据库驱动已切换为纯 Go 的 modernc.org/sqlite（注册为 sqlite3 别名），
#     因此可用 CGO_ENABLED=0 做真正可运行的交叉编译，无需各平台 C 工具链。
#   - 交叉编译/拷贝配置/打包 zip 统一由 tools/build 这个 Go 助手完成，
#     避免不同 OS 下 shell 命令（cp/zip/mkdir）差异导致的不可移植问题。
#   - 资源（migrations/skills/configs，以及 web/dist）已在编译期通过根目录 assets 包
#     go:embed 打入二进制，产物为「单个可执行文件」dist/<name>-<goos>-<goarch>[.exe]，
#     不再附带任何同级目录；运行时也无需外部文件。
# ----------------------------------------------------------------------------

vars:
  BIN_NAME: client
  CMD_PATH: ./cmd/client
  DIST: dist

tasks:
  default:
    desc: 列出所有可用任务
    cmds:
      - cmd: task --list

  dev:
    desc: 默认开发模式（同 dev1）
    deps: [dev1]

  dev1:
    desc: dev1 环境开发模式（前端 Vite 热更新 + Go 后端，连接 dev1 云端）
    env:
      GIN_MODE: debug
      APP_ENV: dev1
      GOTEAMS_DEV_WEB_URL: http://localhost:5173
    cmds:
      - cmd: npm --prefix web run dev1

  prod:
    desc: 生产环境开发模式（前端 Vite 热更新 + Go 后端，连接生产云端）
    env:
      GIN_MODE: debug
      APP_ENV: prod
      GOTEAMS_DEV_WEB_URL: http://localhost:5173
    cmds:
      - cmd: npm --prefix web run devprod

  web:dev:
    desc: 同 dev1（npm run dev1 完整开发模式，前端 Vite 热更新）
    deps: [dev1]

  web:build:
    desc: 仅构建前端，输出 web/dist（需先 npm install）
    cmds:
      - cmd: npm --prefix web run build

  run:
    desc: 仅启动 Go 后端（go run，不含前端 Vite；纯后端/Api 调试用，默认 dev1 环境）
    env:
      GIN_MODE: debug
      APP_ENV: dev1
    cmds:
      - cmd: go run {{.CMD_PATH}}

  run:prod:
    desc: 仅启动 Go 后端（生产环境）
    env:
      GIN_MODE: debug
      APP_ENV: prod
    cmds:
      - cmd: go run {{.CMD_PATH}}

  tidy:
    desc: 整理并下载依赖 (go mod tidy)
    cmds:
      - cmd: go mod tidy

  test:
    desc: 运行全部单元测试
    cmds:
      - cmd: go test ./...

  vet:
    desc: 静态检查 (go vet)
    cmds:
      - cmd: go vet ./...

  build:
    desc: 交叉编译全部目标平台（Windows/macOS/Linux × amd64/arm64），产出单个可执行文件（web/dist 存在时一并嵌入）
    deps:
      - build:windows-amd64
      - build:windows-arm64
      - build:darwin-amd64
      - build:darwin-arm64
      - build:linux-amd64
      - build:linux-arm64

  release:
    desc: 完整发布：先 web:build 构建前端，再交叉编译全部平台（前端嵌入单文件可执行）
    # 注意：必须用 cmds 串行，不能用 deps。deps 是并行执行的，
    # go build 会在 vite 写完 web/dist 之前就把旧产物 embed 进二进制。
    cmds:
      - task: web:build
      - task: build

  build:windows-amd64:
    desc: 构建 Windows/amd64 (client.exe)
    cmds:
      - cmd: go run ./tools/build -goos=windows -goarch=amd64 -name={{.BIN_NAME}} -dist={{.DIST}} -cmd={{.CMD_PATH}}

  build:windows-arm64:
    desc: 构建 Windows/arm64 (client.exe)
    cmds:
      - cmd: go run ./tools/build -goos=windows -goarch=arm64 -name={{.BIN_NAME}} -dist={{.DIST}} -cmd={{.CMD_PATH}}

  build:darwin-amd64:
    desc: 构建 macOS/Intel (amd64)
    cmds:
      - cmd: go run ./tools/build -goos=darwin -goarch=amd64 -name={{.BIN_NAME}} -dist={{.DIST}} -cmd={{.CMD_PATH}}

  build:darwin-arm64:
    desc: 构建 macOS/Apple Silicon (arm64)
    cmds:
      - cmd: go run ./tools/build -goos=darwin -goarch=arm64 -name={{.BIN_NAME}} -dist={{.DIST}} -cmd={{.CMD_PATH}}

  build:linux-amd64:
    desc: 构建 Linux/amd64
    cmds:
      - cmd: go run ./tools/build -goos=linux -goarch=amd64 -name={{.BIN_NAME}} -dist={{.DIST}} -cmd={{.CMD_PATH}}

  build:linux-arm64:
    desc: 构建 Linux/arm64
    cmds:
      - cmd: go run ./tools/build -goos=linux -goarch=arm64 -name={{.BIN_NAME}} -dist={{.DIST}} -cmd={{.CMD_PATH}}

  clean:
    desc: 删除 dist/ 产物目录
    cmds:
      - cmd: rmdir /S /Q dist
        platforms: [windows]
      - cmd: rm -rf dist
        platforms: [linux, darwin]
